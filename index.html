<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Beat Golf</title>
<link rel="icon" href="icon.svg" type="image/svg+xml" />

<meta name="theme-color" content="#1d3b1f" />

<style>
  :root { --bg:#10200f; }

</style>
</head>
<body>
<canvas id="c" aria-label="Beat Golf: aim, then tap when a meter cell lights. The cell you hit on sets the power."></canvas>
<script>
const cv = document.getElementById("c"), ctx = cv.getContext("2d");
const LW = 420, LH = 760, METER_Y = 700, HOLES = 9, FONT = '"Space Grotesk", system-ui, sans-serif';
let W, H, sc, ox, oy, dpr;
function resize() { dpr = Math.min(2, devicePixelRatio || 1); W = innerWidth; H = innerHeight; cv.width = W * dpr; cv.height = H * dpr;
  sc = Math.min(W / LW, H / LH); ox = (W - LW * sc) / 2; oy = (H - LH * sc) / 2; }
resize(); addEventListener("resize", resize);
const store = { get(k) { try { return localStorage.getItem(k); } catch { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch {} } };

// =================== music (its clock is the game clock) ===================
// One meter cell = one eighth note. The lead arpeggio climbs with the meter and peaks on the "1".
const BPM = 104, BEAT = 60 / BPM, E = BEAT / 2, BAR = BEAT * 4;
let A = null, master, echo, t0 = 0, nNote = 0, noiseBuf, muted = false, calib = +(store.get("beatgolf-sync") || 0);
const midi = m => 440 * 2 ** ((m - 69) / 12), ROOTS = [48, 45, 41, 43], MINOR = [false, true, false, false];
function audio() {
  if (A) return; A = new (window.AudioContext || window.webkitAudioContext)();

  echo = A.createDelay(); echo.delayTime.value = E * .75;
  const fb = A.createGain(), wet = A.createGain(); fb.gain.value = .32; wet.gain.value = .45;
  echo.connect(fb); fb.connect(echo); echo.connect(wet); wet.connect(master);
  noiseBuf = A.createBuffer(1, A.sampleRate, A.sampleRate); const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  t0 = A.currentTime + .15; nNote = 0; setInterval(sched, 25);
}
// What you hear right now: the audio clock minus the output delay (plus the user's sync setting).
const lat = () => A ? (A.outputLatency || A.baseLatency || 0) + calib : 0;
const now = () => A ? A.currentTime - lat() : 0;
function env(node, t, peak, dec, wet) { const g = A.createGain(); g.gain.setValueAtTime(peak, t); g.gain.exponentialRampToValueAtTime(.0001, t + dec); node.connect(g); g.connect(master); if (wet) g.connect(echo); }
function noise(t, peak, dec, freq = 7000, type = "highpass", q = 1, toFreq) {
  const s = A.createBufferSource(); s.buffer = noiseBuf; const f = A.createBiquadFilter(); f.type = type; f.frequency.setValueAtTime(freq, t); f.Q.value = q;
  if (toFreq) f.frequency.exponentialRampToValueAtTime(toFreq, t + dec); s.connect(f); env(f, t, peak, dec); s.start(t, Math.random() * .4); s.stop(t + dec + .02);
}
function tone(t, freq, peak, dec, type = "sine", glide, wet, cut) {
  const o = A.createOscillator(); o.type = type; o.frequency.setValueAtTime(freq, t); if (glide) o.frequency.exponentialRampToValueAtTime(glide, t + dec * .6);
  let src = o; if (cut) { const f = A.createBiquadFilter(); f.type = "lowpass"; f.frequency.value = cut; o.connect(f); src = f; }

function sched() {

    const cell = step === 0 ? 8 : step, arp = [0, third, 7, 12, 12 + third, 19, 24, 24 + third + (cell === 8 ? 3 : 0)];
    noise(t, step % 2 ? .03 : .055, step % 2 ? .06 : .03, 8000);
    if (step === 0 || step === 3 || step === 4) tone(t, 160, step === 3 ? .55 : .95, .22, "sine", 45);
    if (step === 2 || step === 6) { noise(t, .32, .11, 1800); tone(t, 220, .18, .07, "triangle", 160); }
    tone(t, midi(root - 12 + (step % 2 ? 12 : 0)), .16, E * .85, "square", null, false, 900);
    tone(t, midi(root + 12 + arp[cell - 1]), cell === 8 ? .09 : .055, cell === 8 ? .35 : .16, "square", null, true, 3200);

const chord = () => { const b = Math.max(0, Math.floor((A.currentTime - t0) / BAR)) % 4; return { root: ROOTS[b], third: MINOR[b] ? 3 : 4 }; };
const sfx = {
  // A full swing: crack + thump + metal ting + the ball whooshing away. Perfect adds a low boom and a sparkle in key.
  club(power, perfect) {
    const t = A.currentTime;
    noise(t, 1, .02, 3400, "bandpass", 1.4);
    tone(t, 240, .7, .1, "sine", 70);
    tone(t, 1870, .05 + power * .007, .55); tone(t, 2790, .035, .4); tone(t, 4110, .02, .25);
    noise(t + .03, .07 + power * .018, .45 + power * .07, 2400, "bandpass", 2, 380);
    if (perfect) { const c = chord(); tone(t, 62, .55, .4, "sine", 38); [0, c.third, 7, 12].forEach((iv, i) => tone(t + .04 + i * E / 4, midi(c.root + 36 + iv), .075, .45, "square", null, true, 4200)); }
  },
  putt(perfect) { const t = A.currentTime; tone(t, 1450, .24, .045, "triangle"); noise(t, .25, .015, 5200); tone(t, 540, .16, .09);
    if (perfect) { const c = chord(); tone(t + .03, midi(c.root + 48), .06, .35, "square", null, true, 4200); } },
  land(ter) { const t = A.currentTime;
    if (ter === "sand") noise(t, .35, .25, 900, "lowpass");
    else if (ter === "green") tone(t, 300, .25, .08, "sine", 180);
    else if (ter === "ice") tone(t, 2400, .06, .3, "sine", 3000);
    else tone(t, 130, .45, .12, "sine", 60); },
  cup() { const t = A.currentTime, c = chord(); tone(t, 330, .4, .16, "sine", 150); [.09, .16, .21].forEach((d, i) => tone(t + d, 900 - i * 150, .14, .04, "triangle"));
    [0, c.third, 7, 12, 12 + c.third, 19].forEach((iv, i) => tone(t + .25 + i * E / 3, midi(c.root + 24 + iv), .12, .5, "square", null, true, 3600)); },
  hazard(kind) { const t = A.currentTime;
    if (kind === "lava") { noise(t, .5, .8, 2500); tone(t, 90, .4, .5, "sawtooth", 40, false, 400); }
    else if (kind === "void" || kind === "canyon") tone(t, 500, .35, .9, "square", 60, true, 1200);
    else noise(t, .55, .55, 320); },
  boing() { const t = A.currentTime; tone(t, 380, .25, .25, "square", 900, true, 2500); },
  bonk() { const t = A.currentTime; tone(t, 180, .35, .1, "triangle", 90); },
};

// =================== courses ===================
const THEMES = [
  { name: "Meadow", seed: 4242, grass: "#3b7a37", fair: "#62b356", edge: "#4f9a45", green: "#86d978", fringe: "#6fc463", sand: "#ead7a0", sandEdge: "#c9b27a",
    haz: { kind: "water", col: "#2f7fc1", label: "Splash! +1" }, tree: "oak", fw: 86, wind: 7, deco: "flowers", cart: true, rough: 480, flag: "#ff4d4d",
    names: ["First Light", "Lazy Bend", "Lily Pad", "Mill Stream", "Oak Alley", "The Sandbox", "Shepherd's Crook", "Long Meadow", "Home"] },
  { name: "Palm Coast", seed: 9137, grass: "#4a8a3a", fair: "#6cc05a", edge: "#5aa64b", green: "#8fe07c", fringe: "#7acb69", sand: "#f3e2b0", sandEdge: "#d6bf85",
    haz: { kind: "water", col: "#1f9bd6", label: "Splash! +1" }, tree: "palm", fw: 56, wind: 14, deco: "shells", cart: true, ocean: true, rough: 480, flag: "#ff7a45",
    names: ["Sunrise", "Driftwood", "Lagoon", "Tide Line", "Palm Row", "The Dunes", "Sea Snake", "Boardwalk", "Sunset"] },
  { name: "Canyon", seed: 777, grass: "#c48a52", fair: "#a7c05a", edge: "#8fa84a", green: "#9fd36a", fringe: "#8cc25c", sand: "#f0d9a0", sandEdge: "#c9a86a",
    haz: { kind: "canyon", col: "#4a2414", label: "Into the canyon +1" }, tree: "cactus", fw: 66, wind: 22, deco: "rocks", rough: 560, flag: "#2f6fe0",
    names: ["Dust Off", "Coyote Bend", "Mesa Top", "The Gorge", "Cactus Row", "Dune Sea", "Rattler", "Long Haul", "High Noon"] },
  { name: "Frost Peaks", seed: 3131, grass: "#e6eef6", fair: "#86b98a", edge: "#a8cdb0", green: "#a2dd9b", fringe: "#8fcd8a", sand: "#e6d9b8", sandEdge: "#c8b88f",
    haz: { kind: "ice", col: "#bfe6ff", label: "" }, tree: "pine", fw: 72, wind: 10, deco: "snow", rough: 650, flag: "#e63946", snowfall: true,
    names: ["Fresh Tracks", "Ski Jump", "Frozen Lake", "Crevasse", "Pine Alley", "Snowdrifts", "Switchback", "Avalanche", "Summit"] },
  { name: "Neon Night", seed: 1984, grass: "#130b2b", fair: "#2a1660", edge: "#ff3cac", green: "#0c4a5a", fringe: "#00e5ff", sand: "#3a2a78", sandEdge: "#8b6cff",
    haz: { kind: "void", col: "#000000", label: "Lost in the void +1" }, tree: "bumper", fw: 70, wind: 0, deco: "stars", rough: 420, flag: "#ff3cac", glow: true,
    names: ["Boot Up", "Glitch", "Data Island", "The Void", "Pinball Alley", "Pixel Field", "Snake.exe", "Long Wave", "Game Over"] },
  { name: "Volcano Isle", seed: 6666, grass: "#2b2726", fair: "#5f8f3a", edge: "#4c7530", green: "#7cc75a", fringe: "#69b24d", sand: "#1d1b1b", sandEdge: "#4a4545",
    haz: { kind: "lava", col: "#ff5a1f", label: "Lava! +1" }, tree: "rock", fw: 70, wind: 16, deco: "embers", rough: 520, flag: "#ffd23f", embers: true,
    names: ["Ash Fall", "Obsidian Bend", "Caldera", "Lava Run", "Boulder Row", "Black Sands", "Magma Snake", "Long Fuse", "Eruption"] },
];
const ARCH = ["opener", "bend", "island", "crossing", "alley", "bunkers", "snake", "long", "finale"];
const PAR = { opener: 4, bend: 4, island: 3, crossing: 4, alley: 4, bunkers: 3, snake: 5, long: 5, finale: 4 };
let theme = THEMES[0];
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const inEll = (e, x, y) => { const c = Math.cos(-e.rot || 0), s = Math.sin(-e.rot || 0), dx = x - e.x, dy = y - e.y, u = dx * c - dy * s, v = dx * s + dy * c; return (u / e.rx) ** 2 + (v / e.ry) ** 2 < 1; };

function makeHole(n) {

  const arch = ARCH[n], par = PAR[arch];
  const tee = { x: 210 + r(-90, 90), y: 652 };
  const cup = { x: r(90, 330), y: par === 3 ? r(385, 430) : par === 4 ? r(150, 250) : r(70, 105) };
  // The fairway is a cubic curve from tee to cup. Bends and snakes push the control points sideways.
  const side = R() < .5 ? -1 : 1, bend = { opener: 30, bend: 150, snake: 170, long: 80, alley: 25, finale: 90 }[arch] ?? 50;
  const c1 = { x: tee.x + side * r(bend * .5, bend), y: tee.y + (cup.y - tee.y) * .33 }, c2 = { x: cup.x + (arch === "snake" ? -side : side) * r(bend * .5, bend), y: tee.y + (cup.y - tee.y) * .66 };
  [c1, c2].forEach(c => c.x = Math.max(50, Math.min(370, c.x)));
  const path = []; for (let i = 0; i <= 48; i++) { const u = i / 48, a = (1 - u) ** 3, b = 3 * u * (1 - u) ** 2, c = 3 * u * u * (1 - u), d = u ** 3;
    path.push({ x: a * tee.x + b * c1.x + c * c2.x + d * cup.x, y: a * tee.y + b * c1.y + c * c2.y + d * cup.y }); }
  const at = u => path[Math.round(u * 48)], perp = u => { const i = Math.round(u * 48), a = path[Math.max(0, i - 1)], b = path[Math.min(48, i + 1)], l = Math.hypot(b.x - a.x, b.y - a.y) || 1; return { x: -(b.y - a.y) / l, y: (b.x - a.x) / l }; };
  const fw = theme.fw * (arch === "alley" ? .85 : arch === "opener" ? 1.15 : 1);
  const green = { x: cup.x + r(-14, 14), y: cup.y + r(-14, 14), r: arch === "island" ? r(46, 54) : r(54, 70) };
  const haz = [], ice = [], sand = [], trees = [], deco = [];
  const zone = e => (theme.haz.kind === "ice" ? ice : haz).push(e);
  if (theme.ocean) { const left = n % 2 === 0; haz.push({ x: left ? -125 : LW + 125, y: 380, rx: 165, ry: 640, rot: 0, ocean: true });
    sand.push({ x: left ? -125 : LW + 125, y: 380, rx: 192, ry: 660, rot: 0, beach: true }); }
  if (arch === "island" || arch === "finale" && R() < .6) zone({ x: green.x, y: green.y, rx: green.r + r(30, 44), ry: green.r + r(24, 36), rot: r(-.4, .4) });
  if (arch === "crossing" || arch === "long") { const p = at(r(.38, .55)), q = perp(.45); zone({ x: p.x, y: p.y, rx: 300, ry: r(16, 24), rot: Math.atan2(q.y, q.x) + r(-.15, .15) }); }
  if (["bend", "snake", "alley", "opener"].includes(arch) && R() < .7) { const u = r(.3, .7), p = at(u), q = perp(u), s = R() < .5 ? -1 : 1, d = fw / 2 + r(30, 55);
    zone({ x: p.x + q.x * s * d, y: p.y + q.y * s * d, rx: r(38, 70), ry: r(22, 38), rot: r(0, 3.14) }); }
  const nB = arch === "bunkers" ? 9 : 1 + Math.floor(R() * 3);
  for (let i = 0; i < nB; i++) { const u = r(.35, .95), p = at(u), q = perp(u), s = R() < .5 ? -1 : 1, d = arch === "bunkers" ? r(-fw / 2, fw / 2 + 40) : fw / 2 + r(4, 26), rr = arch === "bunkers" ? r(10, 18) : r(18, 30);
    sand.push({ x: p.x + q.x * s * d, y: p.y + q.y * s * d, rx: rr * r(1, 1.4), ry: rr, rot: r(0, 3.14) }); }
  for (let i = 0, k = arch === "island" ? 0 : 1 + (R() < .5); i < k; i++) { const a = r(0, 6.28), rr = r(15, 22); sand.push({ x: green.x + Math.cos(a) * (green.r + rr * .6), y: green.y + Math.sin(a) * (green.r + rr * .6), rx: rr * 1.3, ry: rr, rot: a }); }
  const dPath = (x, y) => { let m = 1e9; for (const p of path) { const d = (p.x - x) ** 2 + (p.y - y) ** 2; if (d < m) m = d; } return Math.sqrt(m); };
  const blocked = (x, y, pad) => Math.hypot(x - green.x, y - green.y) < green.r + pad || [...haz, ...ice].some(e => inEll({ ...e, rx: e.rx + pad, ry: e.ry + pad }, x, y)) || Math.hypot(x - tee.x, y - tee.y) < 30;
  const tree = (x, y) => trees.push({ x, y, r: theme.tree === "bumper" ? r(9, 13) : r(11, 19), rot: r(0, 6.28), hit: 0 });
  if (arch === "alley") for (let u = .12; u < .9; u += .075) { const p = at(u), q = perp(u); for (const s of [-1, 1]) { const x = p.x + q.x * s * (fw / 2 + 16), y = p.y + q.y * s * (fw / 2 + 16); if (!blocked(x, y, 10)) tree(x, y); } }
  for (let i = 0, tries = 0; i < (arch === "alley" ? 4 : 7 + n % 5) && tries < 300; tries++) { const x = r(14, 406), y = r(70, 680);
    if (dPath(x, y) < fw / 2 + 18 || blocked(x, y, 22)) continue; tree(x, y); i++; }
  if (theme.tree === "bumper") for (let i = 0; i < (arch === "alley" ? 5 : 2); i++) { const p = at(r(.25, .8)), q = perp(.5), d = r(-fw * .3, fw * .3); if (!blocked(p.x, p.y, 20)) tree(p.x + q.x * d, p.y + q.y * d); }
  for (let i = 0; i < 70; i++) { const x = r(0, LW), y = r(44, 692); if (dPath(x, y) > fw / 2 + 6 && !blocked(x, y, 4)) deco.push({ x, y, s: r(.6, 1.3), k: Math.floor(R() * 3), ph: r(0, 6.28) }); }
  const cart = theme.cart ? path.map((p, i) => { const q = perp(i / 48); return { x: p.x + q.x * side * -(fw / 2 + 24), y: p.y + q.y * side * -(fw / 2 + 24) }; }) : null;
  const wa = r(0, 6.28), wm = arch === "opener" ? 0 : theme.wind * r(.3, 1);

    wind: { x: Math.cos(wa) * wm, y: Math.sin(wa) * wm, m: wm, a: wa }, slope: { x: Math.cos(sa) * sm, y: Math.sin(sa) * sm, a: sa, m: sm } };
}
function terrain(h, x, y) {
  if (x < 4 || x > LW - 4 || y < 44 || y > 692) return "oob";
  if (Math.hypot(x - h.green.x, y - h.green.y) < h.green.r) return "green";
  if (h.haz.some(e => inEll(e, x, y))) return "hazard";
  if (h.ice.some(e => inEll(e, x, y))) return "ice";
  if (h.sand.some(e => inEll(e, x, y))) return "sand";
  if (h.dPath(x, y) < h.fw / 2 || Math.hypot(x - h.tee.x, y - h.tee.y) < 22) return "fairway";

const decel = ter => ({ green: 95, fairway: 190, sand: 950, ice: 28 })[ter] ?? theme.rough;

// =================== game state ===================
let hole, ball, aim, state = "title", strokes = 0, cards = [], last, flight, vel, msg, streak = 0, perfects = 0, hitMark, t = 0;
let parts = [], trail = [], flash = 0, shake = 0, banner = 0, best = null, sync = null, ambient = [];
const bestOf = th => { const v = store.get("beatgolf9-" + th.name); return v === null ? null : +v; };
const fmtPar = v => v === null ? "–" : v === 0 ? "E" : v > 0 ? "+" + v : String(v);
function pickCourse(i) { theme = THEMES[i]; best = bestOf(theme); ambient = []; }
function startRound() { cards = []; streak = 0; perfects = 0; loadHole(0); }
function loadHole(n) { hole = makeHole(n); ball = { x: hole.tee.x, y: hole.tee.y, h: 0 }; strokes = 0; state = "aim"; aimAtCup(); msg = null; banner = 3; trail = []; }
function aimAtCup() { aim = Math.atan2(hole.cup.y - ball.y, hole.cup.x - ball.x); }
const yds = px => Math.round(px * .9);
function club() {
  const ter = terrain(hole, ball.x, ball.y), d = Math.hypot(hole.cup.x - ball.x, hole.cup.y - ball.y);
  if (ter === "green") return { name: "Putter", max: 170, putt: true };
  const c = d > 200 ? { name: "Driver", max: 310 } : d > 112 ? { name: "Iron", max: 215 } : { name: "Wedge", max: 135 };
  c.max *= ter === "rough" ? .82 : ter === "sand" ? .6 : ter === "ice" ? .9 : 1; return c;
}
const phase = () => { const p = ((now() - t0) / BAR) % 1; return p < 0 ? p + 1 : p; };
// The cell that is sounding right now lights from the moment its note plays, then fades.
const curCell = () => { const k = Math.floor(phase() * 8); return k === 0 ? 8 : k; };
const glow = () => 1 - (phase() * 8 % 1);
const say = (text, col = "#fff", big = false) => { msg = { text, col, big, life: 1.6 }; };
const burst = (x, y, n, col, sp = 60, up = 0) => { for (let i = 0; i < n; i++) { const a = Math.random() * 6.283, v = Math.random() * sp; parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - up, life: 1, col, r: 1.5 + Math.random() * 2.5 }); } };

function swing() {
  if (state !== "aim" || !A) return;
  const pos = (now() - t0) / E, k = Math.round(pos), err = (pos - k) * E, step = ((k % 8) + 8) % 8, power = step === 0 ? 8 : step;
  const c = club(), dist = c.max * power / 8, ae = Math.abs(err), perfect = ae < .05;
  let curve = Math.max(-1, Math.min(1, err / .18)) * (c.putt ? .08 : .2), label;
  if (perfect) { curve = 0; label = "PERFECT"; streak++; perfects++; }
  else if (ae < .1) { curve *= .4; label = err < 0 ? "Good · a touch early" : "Good · a touch late"; streak = 0; }
  else { label = err < 0 ? "Early · hooked" : "Late · sliced"; streak = 0; }
  say(label + (streak > 1 ? `  ×${streak}` : ""), perfect ? "#ffe066" : ae < .1 ? "#c8f7c5" : "#ffb4a2", perfect);
  c.putt ? sfx.putt(perfect) : sfx.club(power, perfect);
  hitMark = { power, err, life: 1 };
  if (perfect) { flash = .55; shake = c.putt ? 2 : 6; burst(ball.x, ball.y, 18, "#ffe066", 140); }
  else shake = c.putt ? 0 : 3;
  const ter = terrain(hole, ball.x, ball.y);
  if (!c.putt) burst(ball.x, ball.y, 10, ter === "sand" ? theme.sand : ter === "rough" ? theme.grass : theme.fair, 90, 40);
  strokes++; last = { x: ball.x, y: ball.y }; trail = [];
